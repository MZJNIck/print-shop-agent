# =============================================================
# 打印店接单 Agent 运行配置
#
# 用法：clone 后直接填下面的 deepseek.api_key 即可运行；
#       留空则走离线规则解析（不调模型，5 条样例照样跑通）。
#
# 优先级（高 -> 低）：
#   命令行参数  >  环境变量  >  config.local.yaml  >  config.yaml  >  代码默认值
# =============================================================

deepseek:
  # DeepSeek API Key，形如 sk-xxxxxxxx
  # 留空 -> 不调用大模型，用离线规则解析（5 条样例照样跑通）
  # 填写 -> 走 deepseek-flash 双跑；失败自动降级规则解析
  api_key: ""

  # 模型名（OpenAI 兼容接口的 model 字段）
  model: "deepseek-flash"

  # 接口地址；换代理或兼容服务时改这里
  base_url: "https://api.deepseek.com"

  # 单次请求超时（秒）
  timeout: 45

pricing:
  # 价目表文件，相对本文件所在目录
  file: "pricing.yaml"

# 用户没提排版时的默认口径：
#   none -> 视为不排版（默认）
#   all  -> 视为需要排版
typeset_default: "none"
